<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galgame 收藏</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===================== 头部 ===================== -->
  <header class="site-header">
    <h1 class="site-title" id="site-title">Galgame 收藏</h1>
    <nav class="site-nav">
      <a id="link-bangumi" target="_blank" rel="noopener" hidden>Bangumi 主页 ↗</a>
      <a id="link-2dfan" target="_blank" rel="noopener" hidden>2DFan 主页 ↗</a>
    </nav>
  </header>

  <!-- ===================== 标签页切换 ===================== -->
  <div class="tabs" role="tablist">
    <button class="tab active" id="tab-mine" data-tab="mine" role="tab" aria-selected="true" aria-controls="grid-mine">我的评分</button>
    <button class="tab" id="tab-unplayed" data-tab="unplayed" role="tab" aria-selected="false" aria-controls="grid-unplayed">未收藏的 Galgame</button>
    <button class="tab" id="tab-recommend" data-tab="recommend" role="tab" aria-selected="false" aria-controls="grid-recommend">游戏推荐</button>
  </div>

  <!-- ===================== 工具栏 ===================== -->
  <div class="toolbar" id="main-toolbar">
    <!-- 状态筛选（仅「我的评分」页用） -->
    <label class="tool tool-status" id="tool-status-wrap">
      状态
      <select id="filter-status">
        <option value="all">全部</option>
        <option value="1">想玩</option>
        <option value="3">在玩</option>
        <option value="2" selected>玩过</option>
        <option value="4">搁置</option>
        <option value="5">抛弃</option>
      </select>
    </label>

    <!-- 类型筛选 -->
    <label class="tool" id="tool-type-wrap">
      类型
      <select id="filter-type">
        <option value="all">全部</option>
        <option value="2">动画</option>
        <option value="1">书籍</option>
        <option value="galgame" selected>Galgame</option>
        <option value="4">全部游戏</option>
        <option value="3">音乐</option>
        <option value="6">三次元</option>
      </select>
    </label>

    <!-- 排序 -->
    <label class="tool">
      排序
      <select id="sort-by">
        <option value="rate">我的评分</option>
        <option value="date">标记时间</option>
      </select>
    </label>

    <!-- 搜索框 -->
    <input id="search-box" class="tool search" type="search" aria-label="搜索条目" placeholder="搜索标题 / 短评…" />
  </div>

  <div id="recommend-controls" class="recommend-controls" hidden>
    <div>
      <h2>下一部玩什么？</h2>
      <p>仅从通过类型筛选的 Galgame 与视觉小说中，按你的评分、作者和题材挑选。排除已玩作品的不同演绎与版本，保留续集和外传。</p>
    </div>
    <div class="recommend-actions">
      <label class="tool">推荐方向
        <select id="recommend-mode">
          <option value="personal">适合我的</option>
          <option value="sequels">续集与外传</option>
          <option value="quality">口碑优先</option>
        </select>
      </label>
      <button class="pg-btn" id="recommend-next">换一批</button>
      <button class="pg-btn" id="recommend-restore" hidden>恢复已隐藏</button>
      <span id="recommend-batch" class="pg-info"></span>
    </div>
    <p id="recommend-summary" class="recommend-summary"></p>
  </div>

  <!-- ===================== 内容区 ===================== -->
  <main>
    <p id="unplayed-note" class="list-note" hidden>已结合游戏类型、Galgame 分类与标签共识筛选；排除我的全部收藏状态。</p>
    <!-- 加载 / 错误提示 -->
    <div id="status-msg" class="status-msg" role="status" aria-live="polite">加载中…</div>

    <!-- 卡片网格：我的评分 -->
    <section id="grid-mine" class="card-grid" role="tabpanel" aria-labelledby="tab-mine"></section>

    <!-- 列表：未收藏的 Galgame -->
    <section id="grid-unplayed" class="card-grid hidden" role="tabpanel" aria-labelledby="tab-unplayed"></section>
    <section id="grid-recommend" class="card-grid hidden" role="tabpanel" aria-labelledby="tab-recommend"></section>
  </main>

  <footer class="site-footer">
    <span>数据来自 <a href="https://bgm.tv" target="_blank" rel="noopener">Bangumi</a></span>
    <span id="snapshot-time"></span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
