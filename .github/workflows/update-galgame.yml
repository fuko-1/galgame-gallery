name: 每日更新数据

on:
  schedule:
    - cron: "17 20 * * *" # 北京时间 04:17；避开整点，实际启动可能延迟
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: data-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 运行回归测试
        run: npm test
      - name: 抓取并校验数据
        run: npm run fetch
      - name: 提交有效快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/galgame-list.json data/my-collections.json data/recommendation-metadata.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 每日更新数据 ($(date -u +%Y-%m-%d))"
            git push
          fi
