name: 每日更新数据

on:
  schedule:
    - cron: "0 20 * * *"   # 北京时间凌晨 4:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取全站 Galgame 清单
        run: node scripts/fetch-galgame.mjs

      - name: 抓取我的收藏
        run: node scripts/fetch-mine.mjs

      - name: 提交更新（有变化才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/galgame-list.json data/my-collections.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 每日更新数据 ($(date -u +%Y-%m-%d))"
            git push
          fi
