name: 更新全站 Galgame 清单

on:
  schedule:
    # 每天北京时间凌晨 4:00（UTC 20:00）自动跑一次
    - cron: "0 20 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动点「Run workflow」触发

permissions:
  contents: write   # 允许把更新后的 JSON 提交回仓库

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取全站 Galgame 清单
        run: node scripts/fetch-galgame.mjs

      - name: 提交更新（有变化才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/galgame-list.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新全站 Galgame 清单 ($(date -u +%Y-%m-%d))"
            git push
          fi
